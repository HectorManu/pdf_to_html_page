<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor PDF a HTML</title>
    <!-- CDN para pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-accent: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --toc-bg: #f8fafc;
        }
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-accent: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #60a5fa;
            --accent-hover: #3b82f6;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --toc-bg: #1e293b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.7;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        html {
            scroll-behavior: smooth;
        }
        .layout-container {
            display: flex;
        }
        .sidebar {
            flex: 0 0 300px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            background: var(--toc-bg);
            padding: 24px;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }
        .main-content {
            flex-grow: 1;
            padding: 40px;
        }
        .toc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }
        .toc-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .theme-toggle {
            background: var(--bg-accent);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            background: var(--accent-color);
            color: white;
            transform: scale(1.05);
        }
        .toc-nav {
            list-style: none;
        }
        .toc-item {
            margin-bottom: 4px;
        }
        .toc-link {
            display: block;
            padding: 8px 12px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .toc-link:hover, .toc-link.active {
            background: var(--bg-accent);
            color: var(--accent-color);
            border-left-color: var(--accent-color);
            transform: translateX(4px);
        }
        .toc-h1 {
            font-weight: 600;
        }
        .toc-h2 {
            padding-left: 20px;
        }
        .toc-h3 {
            padding-left: 32px;
            font-size: 0.85rem;
        }
        .toc-h4 {
            padding-left: 44px;
            font-size: 0.8rem;
        }
        .main-content-header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .document-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        h1, h2, h3, h4 {
            scroll-margin-top: 20px;
        }
        h1 {
            font-size: 2.2rem;
            margin: 48px 0 24px 0;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--accent-color);
        }
        h2 {
            font-size: 1.6rem;
            margin: 40px 0 20px 0;
            padding-left: 16px;
            border-left: 4px solid var(--accent-color);
        }
        h3 {
            font-size: 1.3rem;
            margin: 32px 0 16px 0;
        }
        p {
            margin-bottom: 20px;
            text-align: justify;
        }
        ul, ol {
            margin: 24px 0;
            padding-left: 24px;
        }
        li {
            margin-bottom: 12px;
        }
        a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .mobile-header {
            display: none;
        }
        @media (max-width: 1024px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 1000;
                transform: translateX(-100%);
                background: var(--bg-primary);
                box-shadow: var(--shadow);
            }
            .sidebar.is-open {
                transform: translateX(0);
            }
            .main-content {
                padding: 20px;
            }
            .layout-container {
                display: block;
            }
            .mobile-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px;
                background: var(--bg-secondary);
                border-bottom: 1px solid var(--border-color);
                position: sticky;
                top: 0;
                z-index: 999;
            }
            .menu-toggle {
                background: none;
                border: none;
                font-size: 1.5rem;
                cursor: pointer;
                color: var(--text-primary);
            }
            .overlay {
                display: none;
            }
            .overlay.is-active {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 998;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-header">
        <h1 class="document-title" style="font-size: 1.2rem; margin: 0;">Documento</h1>
        <button class="menu-toggle" id="menu-toggle">☰</button>
    </div>

    <div class="layout-container">
        <aside class="sidebar" id="sidebar">
            <nav class="table-of-contents">
                <div class="toc-header">
                    <h2 class="toc-title">📚 Índice</h2>
                    <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema"><span id="theme-icon">🌙</span></button>
                </div>
                <ul class="toc-nav" id="toc-nav">
                    <!-- Los elementos del índice se generarán dinámicamente -->
                </ul>
            </nav>
        </aside>
        <div class="overlay" id="overlay"></div>

        <main class="main-content">
            <header class="main-content-header">
                <h1 class="document-title">Documento Convertido</h1>
            </header>
            <div id="content">
                <!-- El contenido se generará dinámicamente -->
            </div>
        </main>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById("theme-icon");
            if (html.getAttribute("data-theme") === "dark") {
                html.removeAttribute("data-theme");
                themeIcon.textContent = "🌙";
                localStorage.setItem("theme", "light");
            } else {
                html.setAttribute("data-theme", "dark");
                themeIcon.textContent = "☀️";
                localStorage.setItem("theme", "dark");
            }
        }
        window.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("theme") === "dark") {
                toggleTheme();
            }

            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const tocLinks = document.querySelectorAll('.toc-link');

            function closeMenu() {
                sidebar.classList.remove('is-open');
                overlay.classList.remove('is-active');
            }

            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('is-open');
                overlay.classList.toggle('is-active');
            });
            overlay.addEventListener('click', closeMenu);
            tocLinks.forEach(link => link.addEventListener('click', closeMenu));

            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    const id = entry.target.getAttribute('id');
                    const link = document.querySelector(`.toc-link[href="#${id}"]`);
                    if (entry.isIntersecting) {
                        document.querySelectorAll('.toc-link.active').forEach(l => l.classList.remove('active'));
                        if(link) {
                            link.classList.add('active');
                            link.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }
                });
            }, { rootMargin: "-20% 0px -80% 0px", threshold: 0 });

            document.querySelectorAll('main h1, main h2, main h3, main h4').forEach(h => {
                if(h) observer.observe(h);
            });
        });
    </script>
</body>
</html>
